plugins {
    id 'com.android.application'
}

// Release signing key lives outside the repo (see CLAUDE.md). Updates only install over a build
// signed with the same key, so never lose or change it.
def signingProps = new Properties()
def signingFile = new File(System.getProperty('user.home'), '.carlcd/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

// "Send report" files an issue in the private reports repo with this key (see CLAUDE.md). It also lives
// outside the repo; without it the app builds fine and the button says reports are not set up.
def reportProps = new Properties()
def reportFile = new File(System.getProperty('user.home'), '.carlcd/reports.properties')
if (reportFile.exists()) reportFile.withInputStream { reportProps.load(it) }
def reportKey = (reportProps['token'] ?: '').trim().getBytes('UTF-8').collect { String.format('%02x', (it ^ 0x5A) & 0xFF) }.join()

android {
    namespace 'com.harislcd.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.harislcd.launcher"
        minSdk 24
        targetSdk 33
        versionCode 4
        versionName "2.2"
        buildConfigField 'String', 'REPORT_KEY', "\"${reportKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (signingProps['storeFile']) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingProps['storeFile'] ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
}
